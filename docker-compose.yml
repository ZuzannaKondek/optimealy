services:
  # MySQL Database
  db:
    image: mysql:8.4
    container_name: optimealy-db
    environment:
      MYSQL_DATABASE: optimealy
      MYSQL_USER: optimealy
      MYSQL_PASSWORD: optimealy
      MYSQL_ROOT_PASSWORD: optimealy_root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u optimealy -poptimealy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optimealy-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optimealy-backend
    environment:
      DATABASE_URL: "mysql+aiomysql://optimealy:optimealy@db:3306/optimealy?charset=utf8mb4"
      SECRET_KEY: "dev-secret-key-change-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ENVIRONMENT: "development"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8081","http://localhost:19006","http://localhost:19000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts
    networks:
      - optimealy-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  optimealy-network:
    driver: bridge
